name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y jq xvfb file

      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/appimage/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: L99_Screen-AppImage
          path: dist/*.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes = this version's section of CHANGELOG.md, plus install steps.
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 {f = 1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          printf '\n### Install\n\nDownload the AppImage, `chmod +x` it and run it. The first upload sets up Linux permissions for you (one password prompt). See [CHANGELOG.md](CHANGELOG.md) for all versions.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage 70-aula-l99-screen.rules \
            --title "L99 Screen $ver" --notes-file notes.md
